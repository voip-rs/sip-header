[package]
name = "sip-header"
version = "0.3.13"
edition = "2021"
rust-version = "1.79"
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]
description = "SIP header field parsers: Via, Warning, Auth, Accept, Contact, Call-Info, History-Info, Geolocation, Security, and full IANA header catalog"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ticpu/sip-header"
documentation = "https://docs.rs/sip-header"
readme = "README.md"
keywords = ["sip", "header", "voip", "rfc3261", "parser"]
categories = ["parser-implementations", "network-programming"]
exclude = ["CLAUDE.md", "hooks/", ".claude/", "scripts/"]

[features]
default = ["message"]
message = []
serde = ["dep:serde"]
draft = []
conference-info = ["dep:quick-xml", "serde"]

[dependencies]
sip-uri = { path = "../sip-uri" }
percent-encoding = "2"
serde = { version = "1.0", features = ["derive"], optional = true }
quick-xml = { version = "0.41", features = ["serialize"], optional = true }

[dev-dependencies]
serde_json = "1.0"
quick-xml = { version = "0.41", features = ["serialize"] }
