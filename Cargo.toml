[package]
name = "sip-header"
version = "1.0.0-beta.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "SIP header field parsers: Via, Warning, Auth, Accept, Contact, Call-Info, History-Info, Geolocation, Security, and full IANA header catalog"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/sip-header"
readme = "README.md"
keywords = ["sip", "header", "voip", "rfc3261", "parser"]
categories = ["parser-implementations", "network-programming"]
exclude = ["CLAUDE.md", "hooks/", ".claude/", "scripts/", "crates/"]

[workspace]
members = ["crates/sip-header-catalog"]

[workspace.package]
edition = "2021"
rust-version = "1.79"
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/voip-rs/sip-header"

[workspace.dependencies]
sip-uri = "0.3.0-rc.1"

[features]
default = ["message"]
message = []
serde = ["dep:serde", "sip-header-catalog/serde", "sip-uri/serde"]
conference-info = ["dep:quick-xml", "serde"]

[dependencies]
sip-header-catalog = { version = "1.0.0-rc.1", path = "crates/sip-header-catalog" }
sip-uri.workspace = true
percent-encoding = "2"
serde = { version = "1.0", features = ["derive"], optional = true }
quick-xml = { version = "0.41", features = ["serialize"], optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1.0"
quick-xml = { version = "0.41", features = ["serialize"] }
