[package]
name = "sip-header-types"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "SIP header field value types (name-addr, Via, Warning, Auth, Accept, Contact, Call-Info, History-Info, Geolocation, Security, Replaces) held in wire form, parsed by sip-header"
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/sip-header-types"
readme = "README.md"
keywords = ["sip", "header", "voip", "rfc3261"]
categories = ["data-structures", "network-programming"]

[package.metadata.docs.rs]
all-features = true

[features]
serde = ["dep:serde", "sip-uri-types/serde"]

[dependencies]
sip-uri-types.workspace = true
percent-encoding = "2"
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
