name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    # Lib only: dev-dependencies are free to require a newer toolchain than
    # what we promise published consumers.
    - name: Read rust-version from Cargo.toml
      run: echo "MSRV=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sip-header") | .rust_version')" >> "$GITHUB_ENV"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.MSRV }}

    - name: Check (all features)
      run: cargo check --workspace --all-features

  catalog-msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Read the catalog's rust-version from its Cargo.toml
      run: echo "CATALOG_MSRV=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sip-header-catalog") | .rust_version')" >> "$GITHUB_ENV"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.CATALOG_MSRV }}

    # Last installed is the default, which packages the crate.
    - uses: dtolnay/rust-toolchain@stable

    - name: Check sip-header-catalog at its rust-version (plain and serde)
      run: scripts/catalog-msrv.sh

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Cargo.lock must not be tracked
      run: |
        if [ -n "$(git ls-files Cargo.lock)" ]; then
          echo "Cargo.lock is tracked; it belongs only on release tags." >&2
          exit 1
        fi

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check (no features)
      run: cargo check --workspace --all-targets

    - name: Check (serde)
      run: cargo check --workspace --features sip-header/serde --all-targets

    - name: Check (conference-info)
      run: cargo check --workspace --features sip-header/conference-info --all-targets

    - name: Clippy
      run: cargo clippy --workspace --all-targets -- -D warnings

    - name: Clippy (serde)
      run: cargo clippy --workspace --features sip-header/serde --all-targets -- -D warnings

    # The catalog's registry test keeps SipHeader in sync with this list.
    - name: Count IANA SIP headers
      run: |
        echo "SIP_HEADER_COUNT=$(grep -cvE '^[[:space:]]*(#|$)' crates/sip-header-catalog/iana-sip-headers.txt)" >> "$GITHUB_ENV"

    - name: Count SipHeaderLookup accessors
      run: |
        echo "LOOKUP_COUNT=$(sed -n '/^pub trait SipHeaderLookup/,/^}/p' src/header.rs | grep -c '^ *fn ')" >> "$GITHUB_ENV"

    - name: Test
      run: |
        set -o pipefail
        CARGO_TERM_COLOR=never cargo test --workspace --features sip-header/serde 2>&1 | tee test-output.txt
        passed=$(grep '^test result:' test-output.txt | sed 's/.*ok\. \([0-9]*\) passed.*/\1/' | paste -sd+ | bc)
        echo "TEST_PASSED=$passed" >> "$GITHUB_ENV"

    - name: Update test count badge
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: 9f50aa47ea72d91eb2033a1c48f40246
        filename: test-count.json
        label: tests
        message: "${{ env.TEST_PASSED }} passed"
        color: brightgreen

    - name: Update SipHeader IANA sync badge
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: 9f50aa47ea72d91eb2033a1c48f40246
        filename: sip-header-count.json
        label: SipHeader (IANA)
        message: "${{ env.SIP_HEADER_COUNT }}"
        color: blue

    - name: Update SipHeaderLookup accessor badge
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      uses: schneegans/dynamic-badges-action@v1.9.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: 9f50aa47ea72d91eb2033a1c48f40246
        filename: lookup-count.json
        label: SipHeaderLookup
        message: "${{ env.LOOKUP_COUNT }} accessors"
        color: blue

    - name: Build
      run: cargo build --workspace --release
